[workspace]
members = [
    "crates/atlasfs-core",
    "crates/atlasfs-platform",
    "crates/atlasfs-store",
    "crates/atlasfs-cli",
    "crates/atlasfs-api",
    "crates/atlasfs-fuse",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
